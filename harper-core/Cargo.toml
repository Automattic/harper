[package]
name = "harper-core"
version = "2.9.1"
edition = "2024"
description = "The language checker for developers."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/automattic/harper"

[dependencies]
blanket = "0.4.0"
fst = "0.4.7"
hashbrown = { version = "0.16.1", features = ["serde"] }
is-macro = "0.3.6"
itertools = "0.15.0"
ordered-float = { version = "5.3.0", features = ["serde"] }
paste = "1.0.14"
pulldown-cmark = "0.13.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smallvec = { version = "1.15.1", features = ["serde"] }
thiserror = "2.0.18"
unicode-blocks = "0.1.9"
unicode-script = "0.5.8"
unicode-width = "0.2.2"
levenshtein_automata = { version = "0.2.1", features = ["fst_automaton"] }
cached = "2.0.2"
lru = "0.18.0"
foldhash = "0.2.0"
strum_macros = "0.28.0"
strum = "0.28.0"
ammonia = "4.1.2"
harper-brill = { path = "../harper-brill", version = "2.0.0" }
harper-thesaurus = { path = "../harper-thesaurus", version = "2.0.0", optional = true }
bitflags = { version = "2.11.0", features = ["serde"] }
trie-rs = "0.4.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex = "1.13.1"
boxcar = { version = "0.2.14", optional = true }
flate2 = "1.1.9"

[build-dependencies]
toml = "1.1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
rand = "0.10.1"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
rayon = "1.12.0"

[[bench]]
name = "parse_essay"
harness = false

[[bench]]
name = "spellcheck"
harness = false

[features]
default = ["thesaurus", "concurrent"]
concurrent = ["dep:boxcar"]
thesaurus = ["dep:harper-thesaurus"]

# Internal marker feature that gates the language module system itself.
# English is always included when this is enabled. Each individual language
# feature below enables it so that consumers can build "English + German only"
# or "English only" without pulling in every language.
language-module = []

# Multilingual support (language module system with English + all new languages)
multilingual = ["de", "pt", "sk", "pl"]

# Individual language features
de = ["language-module"]
pt = ["language-module"]
sk = ["language-module"]
pl = ["language-module"]

# Convenience feature to enable all supported languages
all-languages = ["multilingual"]
