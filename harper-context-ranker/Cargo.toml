[package]
name = "harper-context-ranker"
version = "3.1.0"
edition = "2024"
description = "Orders Harper's spelling suggestions by the words around a misspelled word."
license = "Apache-2.0"
repository = "https://github.com/automattic/harper"

[dependencies]
hashbrown = "0.16.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
burn = { version = "0.19.1", default-features = false, features = ["std"], optional = true }
burn-ndarray = { version = "0.19.0", default-features = false, optional = true }
rand = { version = "0.10.1", optional = true }
flate2 = { version = "1.1.10", optional = true }
rayon = { version = "1.12.0", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
training = ["dep:burn", "dep:burn-ndarray", "dep:rand", "dep:flate2", "dep:rayon", "burn/train", "burn/autodiff"]
