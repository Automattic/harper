<!DOCTYPE html>
<html>

<body>
  <h1>Input without a spellcheck attribute</h1>
  <input type="text" value="This is an test">

  <h1>Input with spellcheck disabled</h1>
  <input type="text" spellcheck="false" value="This is an test">

  <h1>Input inheriting a disabled spellcheck</h1>
  <div spellcheck="false">
    <input type="text" value="This is an test">
  </div>

  <h1>Search input</h1>
  <input type="search" value="This is an test">
</body>

</html>
