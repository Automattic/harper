[package]
name = "harper-wasm"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/automattic/harper"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
tracing = "0.1.44"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.97"
harper-core = { path = "../harper-core", version = "2.0.0", default-features = false }
harper-typst = { path = "../harper-typst", version = "2.0.0", optional = true }
once_cell = "1.21.4"
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
getrandom = { version = "0.3.4", default-features = false, features = ["wasm_js"] }
harper-stats = { path = "../harper-stats", version = "2.0.0", features = ["js"] }

[build-dependencies]
toml = "1.1"

[dev-dependencies]
sysinfo = { version = "0.39.5", default-features = false, features = [ "system" ] }

[features]
default = ["english", "typst", "thesaurus", "de"]
typst = ["dep:harper-typst"]
thesaurus = ["harper-core/thesaurus"]
bench = []

# Language features - each enables the corresponding language module in
# harper-core (English is always included once any of these is active).
english = ["harper-core/language-module"]
de = ["english", "harper-core/de"]
pt = ["english", "harper-core/pt"]
sk = ["english", "harper-core/sk"]
pl = ["english", "harper-core/pl"]

# Convenience feature to enable all supported languages
multilingual = ["de", "pt", "sk", "pl"]
all-languages = ["multilingual"]
