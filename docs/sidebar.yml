# The documentation sidebar, in reading order.
#
# `page` is a Markdown file in this folder, without `.md`. `href` is any other link.
# An entry with `items` is a group. A group with a `section` gets its own page at
# /docs/<section> that lists the group's pages.

title: Documentation
description: Guides and reference for Harper, the private grammar checker.

sidebar:
  - items:
      - { title: About, page: about }
  - items:
      - { title: Weir, page: weir }
  - title: Integrations
    section: integrations
    description: Use Harper in your editor, your browser, and the other places you write.
    items:
