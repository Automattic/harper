name: Just Checks

on:
  push:
    branches: ["master", "web-prod"]
  pull_request:
    branches: ["master"]
  merge_group:

# Cancel superseded runs when a PR gets new commits, freeing runners for other
# jobs. Non-PR runs get a unique group, so they are never queued or cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Skip wasm-opt when building the WebAssembly module for these checks. It only makes the
  # module smaller and faster, and took over a minute per job. The Chrome Plugin, WordPress
  # Plugin and Build Web checks still build it with wasm-opt, as shipped.
  DISABLE_WASM_OPT: 1

jobs:
  just-checks:
    runs-on: ubuntu-latest
    name: just ${{ matrix.task }}
    strategy:
      matrix:
        task:
          [
            check-rust,
            check-js,
            test-rust,
            test-harperjs,
            test-vscode,
            test-chrome-plugin,
            test-firefox-plugin,
            test-obsidian,
            check-desktop,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt,clippy
          # The Rust Cache step below already caches the build.
          cache: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Install Tauri Linux dependencies
        # Only the jobs that build Harper Desktop need these.
        if: contains(fromJSON('["check-rust", "test-rust", "check-desktop"]'), matrix.task)
        run: >-
          .github/scripts/apt-install.sh
          libayatana-appindicator3-dev
          librsvg2-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Give each matrix task its own cache. Without this, every job
          # shares one cache key and all but one rebuild from scratch.
          key: ${{ matrix.task }}
          workspaces: |
            . -> target
            harper-desktop/src-tauri -> target
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install `wasm-pack`
        run: cargo binstall wasm-pack --force --no-confirm
      - name: Install `cargo hack`
        run: cargo binstall cargo-hack --force --no-confirm
      - name: Install `tauri-cli`
        run: cargo binstall tauri-cli --force --no-confirm
      - name: Run `${{ matrix.task }}`
        run: just ${{ matrix.task }}
