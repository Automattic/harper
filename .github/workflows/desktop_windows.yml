name: Harper Desktop for Windows

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  merge_group:

# Cancel superseded runs when a PR gets new commits, freeing runners for other
# jobs. Non-PR runs get a unique group, so they are never queued or cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Grant each job only the token permissions it needs.
permissions: {}

jobs:
  desktop-release-tests:
    name: just test-desktop-release
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - run: just test-desktop-release

  desktop-windows:
    name: just build-desktop-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # The Rust Cache step below already caches the build.
          cache: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Enable Corepack
        run: corepack enable
      - name: Install Tauri and cross-compilation dependencies
        run: >-
          .github/scripts/apt-install.sh
          libayatana-appindicator3-dev
          librsvg2-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          llvm
          nsis
      - name: Verify Windows build tools
        run: command -v clang-cl llvm-lib makensis
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "true"
          key: build-desktop-windows
          workspaces: |
            . -> target
            harper-desktop/src-tauri -> target
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install `wasm-pack`
        run: cargo binstall wasm-pack --force --no-confirm
      - name: Install `cargo-xwin`
        run: cargo binstall cargo-xwin --force --no-confirm
      # cargo-xwin otherwise downloads the MSVC CRT and Windows SDK on every
      # run, which takes 5 to 11 minutes.
      - name: Cache MSVC CRT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ runner.os }}
      - name: Build Harper Desktop for Windows
        run: just build-desktop-windows
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harper-desktop-windows-x64
          path: harper-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
          if-no-files-found: error
      # Signed Windows release assets are built and uploaded by Buildkite.
